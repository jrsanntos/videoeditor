# Postgres local para desenvolvimento: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: videoeditor
      POSTGRES_PASSWORD: videoeditor
      POSTGRES_DB: videoeditor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
